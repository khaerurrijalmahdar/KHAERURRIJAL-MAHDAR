<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDAM - Deteksi Angka Meteran</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.16/jspdf.plugin.autotable.min.js"></script>

    <style>
        body {
            background: linear-gradient(to right, #1E3C72, #2A5298);
            color: white;
            font-family: 'Poppins', sans-serif;
        }
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 900px;
            margin: 20px auto;
            padding: 10px;
            gap: 15px;
        }
        .logo img {
            width: 70px;
            height: auto;
        }
        .title {
            flex: 1;
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: linear-gradient(to right, #00c6ff, #007bff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        @media (max-width: 768px) {
            .logo {
                flex-direction: column;
            }
            .logo img {
                width: 60px;
            }
            .title {
                font-size: 22px;
            }
        }
        .container {
            background: white;
            color: black;
            border-radius: 12px;
            padding: 30px;
            margin-top: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .form-control:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.25);
        }
        .card {
            border-radius: 10px;
            border: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; display: none;
        }
        .spinner {
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            width: 50px; height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .btn-custom {
            font-weight: 600;
            padding: 10px 20px;
            font-size: 16px;
        }
        h4, h2 {
            font-weight: 700;
            color: #0D47A1;
        }
    </style>
</head>
<body>
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <div class="container">
        <div class="logo">
            <img src="{{ url_for('static', filename='images/OIP.jpeg') }}" alt="PDAM Logo">
            <h2 class="title"> PENCATATAAN ANGKA METERAN PDAM</h2>
            <img src="{{ url_for('static', filename='images/logo unm png.png') }}" alt="UNM Logo">
        </div>

        <div class="card p-4 mb-4">
            <h4><i class="fas fa-water"></i> Tambah Data & Deteksi Angka Meteran</h4>
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="nama" class="form-label">Nama Pelanggan</label>
                    <input type="text" id="nama" name="nama" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="alamat" class="form-label">Alamat</label>
                    <input type="text" id="alamat" name="alamat" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="tanggal" class="form-label">Tanggal</label>
                    <input type="date" id="tanggal" name="tanggal" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="image" class="form-label">Upload Gambar Meteran</label>
                    <input type="file" id="image" name="image" class="form-control" accept="image/*" required>
                </div>
                <button type="submit" class="btn btn-primary btn-custom w-100"><i class="fas fa-upload"></i> Kirim & Deteksi</button>
            </form>
        </div>

        <div class="card p-4 mb-4">
            <h4><i class="fas fa-table"></i> Data Hasil Pencatatan</h4>
            <input type="text" id="searchInput" class="form-control mb-3" placeholder="Cari data...">
            <div class="table-responsive">
                <table class="table table-bordered table-hover text-center" id="dataTable">
                    <thead class="table-dark">
                        <tr>
                            <th>No</th>
                            <th>Nama</th>
                            <th>Alamat</th>
                            <th>Tanggal</th>
                            <th>Angka Meteran</th>
                        </tr>
                    </thead>
                    <tbody id="dataBody"></tbody>
                </table>
            </div>
        </div>

        <button id="exportCSV" class="btn btn-success btn-custom mb-2 w-100">
            <i class="fas fa-file-csv"></i> Export ke CSV
        </button>

        <button id="exportPDF" class="btn btn-danger btn-custom mb-4 w-100">
            <i class="fas fa-file-pdf"></i> Export ke PDF
        </button>

        <div class="card p-4 mb-4">
            <h2>Form Hitung Tagihan PDAM</h2>
            {% if error %}
                <p class="text-danger">{{ error }}</p>
            {% endif %}
            <form method="POST" action="/generate_tagihan">
                <div class="mb-3">
                    <input type="text" name="nama" class="form-control" placeholder="Nama" required>
                </div>
                <div class="mb-3">
                    <input type="number" name="angka_lama" class="form-control" placeholder="Angka Lama" required>
                </div>
                <div class="mb-3">
                    <input type="number" name="angka_baru" class="form-control" placeholder="Angka Baru" required>
                </div>
                <button type="submit" class="btn btn-primary btn-custom w-100">Generate Struk</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById("uploadForm").addEventListener("submit", function(event) {
            event.preventDefault();
            document.getElementById("loadingOverlay").style.display = "flex";
            let formData = new FormData(this);

            fetch("/upload_detect", {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                document.getElementById("loadingOverlay").style.display = "none";
                Swal.fire("Berhasil!", data.message, "success").then(() => location.reload());
            })
            .catch(error => {
                document.getElementById("loadingOverlay").style.display = "none";
                Swal.fire("Error", "Terjadi kesalahan, silakan coba lagi.", "error");
            });
        });

        document.addEventListener("DOMContentLoaded", function () {
            fetch("/get_data")
                .then(response => response.json())
                .then(data => {
                    let dataBody = document.getElementById("dataBody");
                    dataBody.innerHTML = "";
                    data.forEach((item, index) => {
                        let row = `<tr>
                            <td>${index + 1}</td>
                            <td>${item.nama}</td>
                            <td>${item.alamat}</td>
                            <td>${item.tanggal}</td>
                            <td>${item.angka_meteran}</td>
                        </tr>`;
                        dataBody.innerHTML += row;
                    });
                })
                .catch(error => console.error("Gagal mengambil data:", error));
        });

        document.getElementById("exportCSV").addEventListener("click", function () {
            window.location.href = "/export_csv";
        });

        document.getElementById("exportPDF").addEventListener("click", function () {
            const { jsPDF } = window.jspdf;
            let doc = new jsPDF();
            doc.text("Data Hasil Pencatatan PDAM", 10, 10);
            doc.autoTable({
                head: [["No", "Nama", "Alamat", "Tanggal", "Angka Meteran"]],
                body: Array.from(document.querySelectorAll("#dataTable tbody tr")).map(row =>
                    Array.from(row.querySelectorAll("td")).map(cell => cell.innerText)
                )
            });
            doc.save("Data_PDAM.pdf");
        });

        document.getElementById("searchInput").addEventListener("keyup", function () {
            let filter = this.value.toLowerCase();
            let rows = document.querySelectorAll("#dataTable tbody tr");
            rows.forEach(row => {
                let text = row.innerText.toLowerCase();
                row.style.display = text.includes(filter) ? "" : "none";
            });
        });
    </script>
</body>
</html>
