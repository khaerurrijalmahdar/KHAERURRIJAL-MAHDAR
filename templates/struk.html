<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Struk Tagihan</title>
    <style>
        body { font-family: Arial, sans-serif; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        td, th { border: 1px solid #000; padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <h2>Struk Tagihan Air PDAM</h2>
    <p><strong>Nama:</strong> {{ nama }}</p>
    <p><strong>Angka Lama:</strong> {{ angka_lama }}</p>
    <p><strong>Angka Baru:</strong> {{ angka_baru }}</p>
    <p><strong>Pemakaian:</strong> {{ pemakaian }} m³</p>
    <p><strong>Harga per m³:</strong> Rp {{ harga }}</p>
    <p><strong>Total Tagihan:</strong> Rp {{ total_tagihan }}</p>
</body>
</html>
